[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencourtvision"
version = "0.1.0"
description = "Multimodal (audio + vision) tools that turn fixed-camera tennis match videos into point cuts, highlights, score timelines and 9:16 reels."
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "Antony Vo" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
reel = ["opencv-python>=4.8"]
stt = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
tracknet = ["torch>=2.2"]                                      # BSD-3; TrackNetV3 weights via ocv-fetch-weights
ball = ["torch>=2.2", "opencv-python>=4.8", "gdown>=5"]        # ball engine v2 (gdown: MIT, Drive download)
swingvision = ["openpyxl>=3.1"]                                    # MIT; reading SwingVision exports
embed = ["umap-learn>=0.5"]                                          # BSD-3-Clause, optional 2-D syllable map
dev = ["pytest>=8", "ruff>=0.5", "opencv-python>=4.8", "openpyxl>=3.1"]

[project.scripts]
ocv-swingcut = "opencourtvision.cli.swingcut:main"
ocv-match-start = "opencourtvision.cli.match_start:main"
ocv-reel = "opencourtvision.cli.reel:main"
ocv-eval = "opencourtvision.cli.eval:main"
ocv-sv-audit = "opencourtvision.importers.swingvision:main"
ocv = "opencourtvision.cli.ocv:main"
ocv-bench-ball = "opencourtvision.cli.bench_ball:main"
ocv-label-ball = "opencourtvision.cli.label_ball:main"
ocv-fetch-weights = "opencourtvision.cli.fetch_weights:main"
ocv-app = "opencourtvision.app.__main__:main"

[tool.setuptools.packages.find]
include = ["opencourtvision*"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["opencourtvision/ball/_vendor"]   # third-party code kept byte-identical to upstream

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E702", "E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"opencourtvision.style.presets" = ["*/preset.json", "*/*.cube", "*/*.png", "*/fonts/*"]
"opencourtvision.app" = ["*.md"]
