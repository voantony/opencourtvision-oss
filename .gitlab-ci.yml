# Tests for the AGPL snapshot, plus the static Pages site: homepage at /, Call the Point at /label/.
# The Pages job builds the site and fetches the CC BY clips from the generic package registry; it publishes no package.
stages:
  - test
  - deploy

default:
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg libgl1 libglib2.0-0 file nodejs >/dev/null
    - pip install -q -e ".[dev]"

no-media:
  stage: test
  script:
    - python3 scripts/check_no_media.py

unit:
  stage: test
  script:
    - python -m ruff check .
    - python -m pytest -q --tb=line
    - python benchmarks/public_eval/run_eval.py
    - python benchmarks/public_eval/measure.py --check
    - python benchmarks/detector_bench.py --json detector_bench.json
  artifacts:
    when: always
    paths:
      - detector_bench.json
    expire_in: 7 days

# Pages site (static). Clips are not in git: build_pages.py fetches them from the
# session-01-clips generic package and checks each against labeler-pages/clips.sha256.
# Send is turned on in the built copy only; labeler-pages/submit_config.js keeps it false in git.
# Deploys only after the media check and the test suite pass.
pages:
  stage: deploy
  image: python:3.12-slim
  before_script: []
  needs: ["no-media", "unit"]
  variables:
    GIT_DEPTH: "1"
    CLIPS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/session-01-clips/1.0.0"
  script:
    - PYTHONPATH=. python3 scripts/build_pages.py --fetch-clips --clips-url "$CLIPS" --submit-enabled
    - 'grep -q "submitEnabled: true," public/label/submit_config.js'
    - ls public/label/clips | wc -l
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - site/**/*
        - labeler-pages/**/*
        - scripts/build_pages.py
        - docs/CC_ATTRIBUTION.md
        - .gitlab-ci.yml
